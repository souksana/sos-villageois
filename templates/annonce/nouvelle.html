<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nouvelle annonce - SOS Villageois</title>
    <link rel="icon" type="image/x-icon" href="/static/img/Favicons/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/static/img/Favicons/favicon.svg" />
    <link rel="apple-touch-icon" href="/static/img/Favicons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div id="app">

      <header class="nook-header">
        <div class="header-logo">
          <img src="/static/img/logo.png" alt="logo" />
          <span>SOS Villageois</span>
        </div>
        <a href="/annonces">CLOSE</a>
      </header>

      <div class="nook-subheader">
        <a href="/annonces">&#8249;</a>
        <h2>Nouvelle annonce</h2>
        <span></span>
      </div>

      <div class="nook-content padded">
        <div class="nook-card">

          <div class="nook-logo">
            <img src="/static/img/Icons/Reminders.png" alt="poster" />
            <h1>demander de l'aide</h1>
          </div>

          <p class="erreur" id="erreur" style="display:none"></p>

          <form class="nook-form" onsubmit="posterAnnonce(event)">
            <div>
              <label>titre *</label>
              <input type="text" id="titre" placeholder="ex: besoin d'aide pour mon jardin" required />
            </div>
            <div>
              <label>type de tâche *</label>
              <select id="tache" required>
                <option value="" disabled selected>choisir...</option>
                <option value="jardinage">jardinage</option>
                <option value="bricolage">bricolage</option>
                <option value="courses">courses</option>
                <option value="cuisine">cuisine</option>
                <option value="informatique">informatique</option>
                <option value="garde d'animaux">garde d'animaux</option>
                <option value="déménagement">déménagement</option>
                <option value="autre">autre</option>
              </select>
            </div>
            <div>
              <label>description</label>
              <textarea id="description" rows="4" placeholder="décris ce dont tu as besoin..."></textarea>
            </div>
            <button class="nook-btn" type="submit">poster l'annonce</button>
          </form>

        </div>
      </div>

    </div>
    <script>
      async function posterAnnonce(event) {
        event.preventDefault();
        const errEl = document.getElementById('erreur');
        const res = await fetch('/api/annonces', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            titre:       document.getElementById('titre').value.trim(),
            tache:       document.getElementById('tache').value,
            description: document.getElementById('description').value.trim(),
          })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = `/annonces/${data.id_annonce}`;
        } else {
          errEl.textContent   = data.error;
          errEl.style.display = 'block';
        }
      }
    </script>
  </body>
</html>
