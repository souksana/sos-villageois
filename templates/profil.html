<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ user.pseudo }} - SOS Villageois</title>
    <link rel="icon" type="image/x-icon" href="/static/img/Favicons/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/static/img/Favicons/favicon.svg" />
    <link rel="apple-touch-icon" href="/static/img/Favicons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div id="app">

      <header class="nook-header">
        <div class="header-logo">
          <img src="/static/img/logo.png" alt="logo" />
          <span>SOS Villageois</span>
        </div>
        <a href="/">CLOSE</a>
      </header>

      <div class="nook-subheader">
        <a href="/">&#8249;</a>
        <h2>Mon profil</h2>
        <span></span>
      </div>

      <div class="nook-content padded">
        <div class="profil-page">

          <div class="id-card">
            <div class="id-card-top">
              <div class="id-speech-bubble">Bienvenue dans le village !</div>
            </div>

            <div class="id-card-body">
              <div class="id-card-avatar">
                <img
                  src="{{ user.villageois_photo or '/static/img/logo.png' }}"
                  alt="{{ user.villageois_nom or 'avatar' }}"
                  onerror="this.src='/static/img/logo.png'"
                />
              </div>

              <div class="id-card-info">
                <p class="id-island">Île SOS Villageois</p>
                <p class="id-name">{{ user.pseudo }}</p>
                <p class="id-role">{{ "Admin" if user.role == "admin" else "Villageois(e)" }}</p>
                {% if user.villageois_nom %}
                <p class="id-villager">ressemble à {{ user.villageois_nom }}</p>
                {% endif %}
                <p class="id-email">{{ user.email }}</p>
              </div>
            </div>

            <div class="id-card-footer">
              Membre de l'île &nbsp;·&nbsp; SOS Villageois
            </div>
          </div>

        </div>
      </div>

    </div>
  </body>
</html>
