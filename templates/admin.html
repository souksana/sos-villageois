<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>admin - SOS Villageois</title>
    <link rel="icon" type="image/x-icon" href="/static/img/Favicons/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/static/img/Favicons/favicon.svg" />
    <link rel="apple-touch-icon" href="/static/img/Favicons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div id="app">

      <header class="nook-header">
        <div class="header-logo">
          <img src="/static/img/logo.png" alt="logo" />
          <span>SOS Villageois</span>
        </div>
        <a href="/">CLOSE</a>
      </header>

      <div class="nook-subheader">
        <a href="/">&#8249;</a>
        <h2>Admin</h2>
        <span></span>
      </div>

      <div class="nook-content padded" id="contenu">
        <p style="text-align:center; color:#aaa; padding:40px;">chargement…</p>
      </div>

    </div>
    <script>
      async function charger() {
        const res = await fetch('/api/users');
        if (!res.ok) { window.location.href = '/'; return; }
        const users = await res.json();
        render(users);
      }

      function render(users) {
        const rows = users.map(u => `
          <div class="admin-user-row">
            <div class="admin-user-info">
              <span class="admin-pseudo">${u.pseudo}</span>
              ${u.role === 'admin' ? '<span class="admin-badge">admin</span>' : ''}
              <span class="admin-email">${u.email}</span>
            </div>
            ${u.role !== 'admin'
              ? `<button class="admin-delete-btn" onclick="supprimerUser(${u.id_user}, '${u.pseudo}')">&#10005;</button>`
              : ''}
          </div>`).join('');

        document.getElementById('contenu').innerHTML = `
          <div class="nook-card">
            <p class="step-title">${users.length} utilisateur(s)</p>
            <div class="admin-user-list">${rows}</div>
          </div>`;
      }

      async function supprimerUser(id, pseudo) {
        if (!confirm(`Supprimer ${pseudo} ?`)) return;
        const res = await fetch(`/api/users/${id}`, { method: 'DELETE' });
        if (res.ok) charger();
      }

      charger();
    </script>
  </body>
</html>
