<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disponibilités - SOS Villageois</title>
    <link rel="icon" type="image/x-icon" href="/static/img/Favicons/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/static/img/Favicons/favicon.svg" />
    <link rel="apple-touch-icon" href="/static/img/Favicons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div id="app">

      <header class="nook-header">
        <div class="header-logo">
          <img src="/static/img/logo.png" alt="logo" />
          <span>SOS Villageois</span>
        </div>
        <a href="/">CLOSE</a>
      </header>

      <div class="nook-subheader">
        <a href="/">&#8249;</a>
        <h2>Disponibilités</h2>
        <a href="/dispos/nouvelle">+</a>
      </div>

      <div class="nook-content padded" id="liste">
        <p style="text-align:center; color:#aaa; padding:40px;">chargement…</p>
      </div>

    </div>
    <script>
      function fmtDateShort(iso) {
        return iso ? iso.slice(8,10)+'/'+iso.slice(5,7) : '';
      }

      let meId = null;
      let meRole = null;

      function renderDispos(dispos, mesInterets) {
        const liste = document.getElementById('liste');
        if (!dispos.length) {
          liste.innerHTML = `
            <div class="nook-card" style="text-align:center; padding:40px 20px;">
              <p style="color:#aaa; font-size:0.9em;">personne n'a encore partagé ses dispos</p>
              <a class="nook-btn" href="/dispos/nouvelle" style="margin-top:16px; display:block;">ajouter les miennes</a>
            </div>`;
          return;
        }

        liste.innerHTML = dispos.map(d => {
          const photo = d.villageois_photo || '/static/img/logo.png';
          const peutSupprimer = meId === d.id_user || meRole === 'admin';
          const btnSupprimer  = peutSupprimer
            ? `<button class="dispo-delete-btn" onclick="supprimerDispo(${d.id_dispo})">✕</button>` : '';
          const desc = d.description
            ? `<p class="dispo-desc">${d.description.slice(0,120)}${d.description.length > 120 ? '…' : ''}</p>` : '';
          const interesseCount = d.interet_count > 0
            ? `<span class="interet-count">${d.interet_count} intéressé${d.interet_count > 1 ? 's' : ''}</span>` : '';

          let btnInteret = '';
          if (meId !== d.id_user) {
            const active = mesInterets.includes(d.id_dispo);
            btnInteret = `<button class="interesse-btn ${active ? 'active' : ''}" onclick="toggleInteret(${d.id_dispo})">
              ${active ? '✓ je suis dispo !' : 'je suis intéressé(e)'}
            </button>`;
          } else if (d.interet_count > 0) {
            btnInteret = `<a class="interesse-btn active" href="/dispos/${d.id_dispo}">voir les ${d.interet_count} intéressé${d.interet_count > 1 ? 's' : ''} →</a>`;
          }

          return `
            <div class="nook-card dispo-card">
              <div class="dispo-top">
                <img class="mini-avatar" src="${photo}" alt="${d.pseudo}" onerror="this.src='/static/img/logo.png'" />
                <div class="dispo-meta">
                  <span class="annonce-pseudo">${d.pseudo}</span>
                  <div class="dispo-badges">
                    <span class="dispo-date-badge">${fmtDateShort(d.date_dispo)}</span>
                    <span class="creneau-badge" data-creneau="${d.creneau}">${d.creneau}</span>
                  </div>
                </div>
                ${btnSupprimer}
              </div>
              ${desc}
              <div class="dispo-footer">
                ${interesseCount}
                ${btnInteret}
              </div>
            </div>`;
        }).join('');
      }

      async function supprimerDispo(id) {
        if (!confirm('Supprimer ce créneau ?')) return;
        const res = await fetch(`/api/dispos/${id}`, { method: 'DELETE' });
        if (res.ok) charger();
      }

      async function toggleInteret(id) {
        await fetch(`/api/dispos/${id}/interet`, { method: 'PUT' });
        charger();
      }

      async function charger() {
        const [disposRes, meRes] = await Promise.all([
          fetch('/api/dispos'),
          fetch('/api/users/me')
        ]);
        const { dispos, mes_interets } = await disposRes.json();
        if (meRes.ok) {
          const me = await meRes.json();
          meId   = me.id_user;
          meRole = me.role;
        }
        renderDispos(dispos, mes_interets);
      }

      charger();
    </script>
  </body>
</html>
