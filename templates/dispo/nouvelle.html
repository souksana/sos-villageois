<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nouvelle dispo - SOS Villageois</title>
    <link rel="icon" type="image/x-icon" href="/static/img/Favicons/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/static/img/Favicons/favicon.svg" />
    <link rel="apple-touch-icon" href="/static/img/Favicons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div id="app">

      <header class="nook-header">
        <div class="header-logo">
          <img src="/static/img/logo.png" alt="logo" />
          <span>SOS Villageois</span>
        </div>
        <a href="/dispos">CLOSE</a>
      </header>

      <div class="nook-subheader">
        <a href="/dispos">&#8249;</a>
        <h2>Mes dispos</h2>
        <span></span>
      </div>

      <div class="nook-content padded">
        <div class="nook-card">

          <div class="nook-logo">
            <img src="/static/img/Icons/Calendar.png" alt="dispo" onerror="this.style.display='none'" />
            <h1>je suis disponible</h1>
          </div>

          <p class="erreur" id="erreur" style="display:none"></p>

          <form class="nook-form" onsubmit="posterDispo(event)">
            <div>
              <label>date *</label>
              <input type="date" id="date_dispo" required />
            </div>
            <div>
              <label>créneau *</label>
              <select id="creneau" required>
                <option value="" disabled selected>choisir...</option>
                <option value="matin">matin</option>
                <option value="après-midi">après-midi</option>
                <option value="soir">soir</option>
                <option value="journée entière">journée entière</option>
              </select>
            </div>
            <div>
              <label>pour quoi ? (optionnel)</label>
              <textarea id="description" rows="3" placeholder="ex: je peux aider pour du jardinage ou des courses..."></textarea>
            </div>
            <button class="nook-btn" type="submit">partager ma dispo</button>
          </form>

        </div>
      </div>

    </div>
    <script>
      document.getElementById('date_dispo').min = new Date().toISOString().slice(0, 10);

      async function posterDispo(event) {
        event.preventDefault();
        const errEl = document.getElementById('erreur');
        const res = await fetch('/api/dispos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            date_dispo:  document.getElementById('date_dispo').value,
            creneau:     document.getElementById('creneau').value,
            description: document.getElementById('description').value.trim(),
          })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/dispos';
        } else {
          errEl.textContent   = data.error;
          errEl.style.display = 'block';
        }
      }
    </script>
  </body>
</html>
